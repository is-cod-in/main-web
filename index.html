    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-gradient-start: #1f1f1f;
            --bg-gradient-end: #3b3b3b;
            --text-color: #f0f0f0;
            --container-bg: rgba(40, 44, 52, 0.9);
            --border-color: #61dafb;
            --accent-color: #61dafb;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --shadow-hover: rgba(0, 0, 0, 0.3);
        }

        body.light-mode {
            --bg-gradient-start: #ffffff;
            --bg-gradient-end: #e0e0e0;
            --text-color: #282c34;
            --container-bg: rgba(255, 255, 255, 0.9);
            --border-color: #0097a7;
            --accent-color: #0097a7;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --shadow-hover: rgba(0, 0, 0, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Silkscreen', cursive;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: background 0.3s ease, color 0.3s ease;
            padding: 20px;
        }

        .container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            background: var(--container-bg);
            box-shadow: 0 8px 30px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }

        .container:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 40px var(--shadow-hover);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(97, 218, 251, 0.5);
            animation: fadeIn 1s ease-in-out;
            transition: color 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button {
            padding: 12px 30px;
            font-size: 1rem;
            background: linear-gradient(90deg, #61dafb, #21a1f1);
            border: none;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 5px; 
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
        }

        .button:hover {
            background: linear-gradient(90deg, #21a1f1, #61dafb);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .subdomain-input {
            margin: 20px 0;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            width: 250px;
            background: var(--container-bg);
            color: var(--text-color);
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s, color 0.3s;
        }

        .subdomain-input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 5px rgba(97, 218, 251, 0.5);
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            text-decoration: underline;
            color: #0097a7;
        }

        .nav {
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .nav a {
            margin: 0 15px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #0097a7;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-color);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px var(--shadow-hover);
        }

        .theme-toggle i {
            font-size: 1.5rem;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .subdomain-input {
                width: 80%;
            }
            .button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .theme-toggle {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
            .theme-toggle i {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="nav">
        <a href="index.html">Home</a>
        <a href="/team">Team</a>
        <a herf="https://xsplitter.is-cod.in">XSplitter S 3</a>
    </div>

    <div class="container">
        <h1 data-text="is-cod.in">is-cod.in</h1>

        <div class="button-container">
            <button class="button" onclick="window.open('https://github.com/is-cod-in/register', '_blank')">
                <i class="fab fa-github icon"></i> Register with GitHub
            </button>
            
            <button class="button" onclick="window.open('https://discord.gg/zEVFx2Vdq5', '_blank')">
                <i class="fab fa-discord icon"></i> Register with Discord
            </button>
        </div>

        <p>Get your own subdomain today!</p>
        
        <input type="text" id="subdomainInput" class="subdomain-input" placeholder="Enter subdomain name" />
        <button class="button" onclick="redirectToSubdomain()">Claim Subdomain</button>
    </div>

    <footer>
        Made with ❤️ by <a href="https://is-cod.in" target="_blank">is-cod.in</a> team
    </footer>

    <script>
        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        // Check for saved theme preference or default to system preference
        function getPreferredTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                return savedTheme;
            }
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        // Apply theme
        function applyTheme(theme) {
            if (theme === 'light') {
                body.classList.add('light-mode');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                body.classList.remove('light-mode');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        // Toggle theme
        function toggleTheme() {
            const currentTheme = body.classList.contains('light-mode') ? 'light' : 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }

        // Initialize theme on page load
        applyTheme(getPreferredTheme());

        // Listen for theme toggle clicks
        themeToggle.addEventListener('click', toggleTheme);

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches ? 'light' : 'dark');
            }
        });

        // Subdomain redirect function
        function redirectToSubdomain() {
            const subdomain = document.getElementById('subdomainInput').value.trim().toLowerCase();
            if (subdomain && /^[a-z0-9-]+$/.test(subdomain)) {
                window.location.href = `https://${subdomain}.is-cod.in`;
            } else {
                alert('Please enter a valid subdomain! (letters, numbers, and hyphens only)');
            }
        }
    </script>

</body>
